<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fiverr reviews</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f901add9d736276c532f1e80529fbc09">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Fraunces:opsz,wght@9..144,300&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#06050B}</style>
</helmet>
<section aria-labelledby="reviews-title" style="--acc: {{c}}; --accl: {{l}}; --rgb: {{rgb}}; font-family: Geist, system-ui, sans-serif; color: #F4EFE6; width: 100%; box-sizing: border-box; padding: 120px 28px 40px">
<div style="max-width: 1180px; margin: 0 auto">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px">
<div style="max-width: 640px">
<p style="margin: 0 0 14px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: {{c}}">Verified on Fiverr</p>
<h2 id="reviews-title" style="font-weight: 500; font-size: clamp(40px, 5vw, 68px); line-height: 1; letter-spacing: -0.045em; margin: 0">Clients who kept <span style="font-family: Fraunces, serif; font-weight: 300; font-style: italic; color: {{l}}">coming back.</span></h2>
<p style="margin: 20px 0 0; font-size: 17px; line-height: 1.65; color: #BAC2D0; max-width: 52ch">Before MarginBird, Ayman managed and grew Instagram pages on Fiverr. These are buyers' own words.</p>
</div>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<div style="min-width: 150px; padding: 20px 22px; border-radius: 20px; background: linear-gradient(180deg, #141225, #09080F); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 0 0 1px rgba(244,239,230,0.07)">
<div style="font-family: Fraunces, serif; font-weight: 300; font-size: 44px; line-height: 1; letter-spacing: -0.03em; background: {{g}}; -webkit-background-clip: text; background-clip: text; color: transparent">{{s.n}}</div>
<div style="font-size: 14px; line-height: 1.45; color: #BAC2D0; margin-top: 8px">{{s.l}}</div>
</div>
</sc-for>
</div>
</div>

<div style="margin-top: 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px">
<sc-for list="{{reviews}}" as="r" hint-placeholder-count="8">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 22px; background: linear-gradient(180deg, #121022, #08070E); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 0 1px rgba(244,239,230,0.07)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
<span role="img" aria-label="5 out of 5 stars" style="display: inline-flex; gap: 2px">
<sc-for list="{{five}}" as="st" hint-placeholder-count="5"><svg width="15" height="15" viewBox="0 0 24 24" fill="{{c}}" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></sc-for>
</span>
<sc-if value="{{r.repeat}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; color: {{l}}; background: rgba({{rgb}},0.12); border: 1px solid rgba({{rgb}},0.35)">{{r.repeatLabel}}</span></sc-if>
</div>
<blockquote style="margin: 0; font-size: 18px; line-height: 1.5; letter-spacing: -0.01em; color: #F4EFE6">&#8220;{{r.text}}&#8221;</blockquote>
<figcaption style="margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(244,239,230,0.07); display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 25%, #2E2852, #0D0B18); box-shadow: 0 0 0 1px rgba({{rgb}},0.4); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: {{l}}">{{r.ini}}</span>
<span style="min-width: 0"><span style="display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span><span style="display: block; font-size: 13px; color: #8F99AD">{{r.meta}}</span></span>
</figcaption>
</figure>
</sc-for>
</div>

<sc-if value="{{canMore}}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 22px; text-align: center"><button type="button" onClick="{{showMore}}" style="min-height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid rgba({{rgb}},0.45); background: rgba({{rgb}},0.08); color: #F4EFE6; font-family: Geist, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer">{{moreLabel}}</button></div>
</sc-if>
<div style="margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px">
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #DCE1EA; max-width: 60ch">100+ verified reviews. 96 five-star. Buyers in 10 countries, from the US and UK to Singapore and Japan.</p>
<a href="https://www.fiverr.com/humanbeing489/do-professional-instagram-and-facebook-management#reviews" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(244,239,230,0.18); color: #F4EFE6; text-decoration: none; font-size: 15px; font-weight: 500">Read all 100 on Fiverr<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg></a>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"violet","options":["ice","platinum","violet","gold"]},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { more: false }; }
  renderVals() {
    const TH = {
      ice: { c: '#7DB9FF', l: '#CFE6FF', rgb: '125,185,255', s: ['#3E78C9', '#CFE6FF', '#7DB9FF', '#F3F9FF', '#4F8BD9'] },
      platinum: { c: '#DDE3EE', l: '#FFFFFF', rgb: '220,228,240', s: ['#8E97A8', '#F6F8FC', '#C3CAD6', '#FFFFFF', '#9AA3B3'] },
      violet: { c: '#A78BFF', l: '#DCD2FF', rgb: '167,139,255', s: ['#6C4FE0', '#DCD2FF', '#A78BFF', '#F3EEFF', '#7A5CF0'] },
      gold: { c: '#F0C462', l: '#FFE3A0', rgb: '240,196,98', s: ['#A9792A', '#F7DC94', '#E0B04E', '#FFF3C8', '#B8893A'] }
    };
    const T = TH[this.props.theme] || TH.violet;
    const g = 'linear-gradient(110deg, ' + T.s[0] + ' 0%, ' + T.s[1] + ' 28%, ' + T.s[2] + ' 52%, ' + T.s[3] + ' 72%, ' + T.s[4] + ' 100%)';
    // Word for word from fiverr-reviews.json (pulled 2026-11-07), original spelling kept.
    const raw = [
      ['lisgebrendler', 'Russia', '2021', "I've ordered Instagram marketing and got delivered great results. Very friendly and prompt communication. He even gave me helpful tips, which went beyond my order. Will order again! Thank you!", '$100–$200', false],
      ['user61676420', 'United Kingdom', '2021', 'Perfect will be working long term, very informative, researches well and gives extra time and effort into the business. Well Done. Lets Grow Together!!', '$100–$200', false],
      ['jacobmeyer1', 'United States', '2021', 'Great service been working with him for months', '$100–$200', true],
      ['theflanshoppe', 'United States', '2020', 'Seller is very reliable and is really good at communicating and explaining the process to me. Looking forward to continuing to work with him!', '$50–$100', false],
      ['reiadsubrat1', 'United States', '2021', "Amazing work as always. This is my third time working with him and it's always a pleasure", '$50–$100', true],
      ['user22738305', 'United States', '2021', 'Overall excellent service non stop working on my project. Will always hiring again and fully recommend', '$50', true],
      ['bestdeal87', 'United States', '2020', 'He really put in an effort to help improve my instagram Page I will work with him again', '$100–$200', false],
      ['budarap', 'United States', '2020', 'Amazing job and super fast!! Wow!! Thank you. You did just what you said you could do!! Thank you.', '$50', false],
      // revealed by "Show more"
      ['precious2005', 'United Kingdom', '2021', "I'm so happy to work with human, thank you so much for the job well done. I will be call back again.", '$100–$200', false],
      ['reiadsubrat1', 'United States', '2020', 'Always great to work with. I have used this seller multiple times always with great results.', '$50–$100', true],
      ['jacobmeyer1', 'United States', '2022', 'Will continue to work with Ayman.', '$400–$600', true],
      ['elisabetefer406', 'United States', '2022', 'Thank you . Please continue our regular format', '$100–$200', true],
      ['davidcoleman11', 'United Kingdom', '2020', "Really great service and does exactly what's required will definitely book again", '$100–$200', true],
      ['michaelgall', 'United States', '2020', 'Amazing. Fast communication very creative! Definitely will return.', '$50–$100', false],
      ['jaakt6', 'United States', '2021', 'He did exactly as promised. Great overall experience.', '$100–$200', false],
      ['floresaf', 'United States', '2020', 'Great communication! Immediately started on the job as I went from 1030 followers to 1320 within a week.', '$50', false],
      ['fafi20', 'South Africa', '2021', 'Very happy with the service!!! Did everything as promised', '$50–$100', false],
      ['jacobmeyer1', 'United States', '2021', 'OUT STANDING WORK! Will be working for a long time together', '$100–$200', true],
      ['mmarouane', 'Netherlands', '2021', 'Great seller! Will work definitely again with him!', '$50–$100', true],
      ['barbratolvonen', 'Finland', '2021', 'Thanks Soo much, am happy and do recommend.i will definitely come back', '$50–$100', false]
    ];
    const FIRST = 8;
    const all = this.state.more;
    return {
      c: T.c, l: T.l, rgb: T.rgb, g,
      five: [1, 2, 3, 4, 5],
      stats: [
        { n: '100', l: 'reviews on one Fiverr gig' },
        { n: '96', l: 'of them five stars' },
        { n: '3×+', l: 'orders from several buyers' }
      ],
      reviews: raw.slice(0, all ? raw.length : FIRST).map(([name, country, yr, text, price, rep]) => ({
        name, text, ini: name[0].toUpperCase(),
        meta: 'Hired Ayman · ' + country + ' · ' + yr,
        repeat: rep, repeatLabel: 'Repeat client'
      })),
      canMore: !all, moreLabel: 'Show ' + (raw.length - FIRST) + ' more reviews',
      showMore: () => this.setState({ more: true })
    };
  }
}
</script>
</body>
</html>
