<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Process player</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f901add9d736276c532f1e80529fbc09">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Fraunces:opsz,wght@9..144,300;9..144,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootCls}}" style="--acc: {{t.c}}; --accl: {{t.l}}; --rgb: {{t.rgb}}; font-family: Geist, system-ui, sans-serif; color: #F4EFE6; border-radius: 28px; padding: 1px; background: linear-gradient(160deg, rgba({{t.rgb}},0.55), rgba(244,239,230,0.06) 40%, rgba({{t.rgb}},0.25))">
<div style="border-radius: 27px; overflow: hidden; background: linear-gradient(180deg, #111A2B 0%, #070A12 100%)">

<div style="display: flex; flex-wrap: wrap; min-height: 400px">
<!-- stage -->
<div style="flex: 1.15 1 420px; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: radial-gradient(420px circle at 50% 45%, rgba({{t.rgb}},0.16), transparent 70%); overflow: hidden">
<div aria-hidden="true" class="spin" style="position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 1px dashed rgba({{t.rgb}},0.3)"></div>
<div aria-hidden="true" class="spinr" style="position: absolute; width: 380px; height: 380px; border-radius: 50%; border: 1px solid rgba(244,239,230,0.05)"><span style="position: absolute; top: 50%; right: -4px; width: 8px; height: 8px; border-radius: 50%; background: {{t.l}}; box-shadow: 0 0 14px {{t.c}}"></span></div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="1">
<sc-if value="{{s.cur}}" hint-placeholder-val="{{ true }}">
<div class="pop" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px">
<div style="position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 35% 25%, #2C3956 0%, #111829 55%, #05070D 100%); box-shadow: inset 0 2px 1px rgba(255,255,255,0.2), inset 0 -10px 22px rgba(0,0,0,0.6), 0 0 0 1.5px rgba({{t.rgb}},0.7), 0 0 0 8px rgba({{t.rgb}},0.06), 0 24px 50px -12px rgba(0,0,0,0.9), 0 0 70px -6px rgba({{t.rgb}},0.45); display: flex; align-items: center; justify-content: center">
<span aria-hidden="true" class="ping" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba({{t.rgb}},0.6)"></span>
<svg class="float" width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="url(#plGrad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="filter: drop-shadow(0 0 8px rgba({{t.rgb}},0.8)) drop-shadow(0 0 22px rgba({{t.rgb}},0.4))"><defs><linearGradient id="plGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{t.s1}}"></stop><stop offset="0.35" stop-color="{{t.s2}}"></stop><stop offset="0.6" stop-color="{{t.s3}}"></stop><stop offset="1" stop-color="{{t.s4}}"></stop></linearGradient></defs><path d="{{s.icon}}"></path></svg>
</div>
<div style="display: flex; gap: 8px; align-items: center"><span style="font-family: Fraunces, serif; font-weight: 300; font-size: 22px; color: {{t.l}}">{{s.num}}</span><span style="font-size: 14px; color: #8F99AD">of {{total}}</span>
<sc-if value="{{s.auto}}" hint-placeholder-val="{{ false }}"><span style="margin-left: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: {{t.ink}}; background: {{t.g}}">Automated</span></sc-if>
</div>
</div>
</sc-if>
</sc-for>
</div>

<!-- text side -->
<div style="flex: 1 1 360px; min-width: 0; padding: 40px 36px; display: flex; flex-direction: column; border-left: 1px solid rgba(244,239,230,0.06)">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="1">
<sc-if value="{{s.cur}}" hint-placeholder-val="{{ true }}">
<div class="pop" style="min-height: 150px">
<sc-if value="{{s.hasWhen}}" hint-placeholder-val="{{ false }}"><div style="font-size: 14px; color: {{t.l}}; margin-bottom: 10px">{{s.when}}</div></sc-if>
<h3 style="font-weight: 500; font-size: 34px; line-height: 1.08; letter-spacing: -0.035em; margin: 0">{{s.t}}</h3>
<p style="font-size: 17px; line-height: 1.6; color: #BAC2D0; margin: 14px 0 0">{{s.d}}</p>
</div>
</sc-if>
</sc-for>
<div style="margin-top: auto; padding-top: 28px">
<div style="display: flex; gap: 6px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{s.go}}" aria-label="{{s.aria}}" style="flex: 1; height: 24px; padding: 10px 0; border: 0; background: transparent; cursor: pointer">
<span style="display: block; height: 4px; border-radius: 2px; background: rgba(244,239,230,0.12); overflow: hidden">
<sc-if value="{{s.cur}}" hint-placeholder-val="{{ false }}"><span class="fillnow" style="display: block; height: 100%; background: {{t.g}}; box-shadow: 0 0 10px {{t.c}}; animation-duration: {{dur}}"></span></sc-if>
<sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}"><span style="display: block; height: 100%; background: rgba({{t.rgb}},0.55)"></span></sc-if>
</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 14px">
<button type="button" onClick="{{prev}}" aria-label="Previous step" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(244,239,230,0.14); background: transparent; color: #F4EFE6; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: {{t.g}}; color: {{t.ink}}; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px -6px {{t.c}}">
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
<sc-if value="{{stopped}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg></sc-if>
</button>
<button type="button" onClick="{{next}}" aria-label="Next step" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(244,239,230,0.14); background: transparent; color: #F4EFE6; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<span style="margin-left: auto; font-size: 14px; color: #8F99AD">{{label}}</span>
</div>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"violet","options":["ice","platinum","violet","gold"]},"steps":{"editor":null},"label":{"editor":"text","default":"How it works"},"$preview":{"width":1100,"height":420}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, paused: false }; }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.paused) return;
      const n = (this.props.steps || []).length || 1;
      this.setState({ i: (this.state.i + 1) % n });
    }, 4200);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const TH = {
      ice: { c: '#7DB9FF', l: '#CFE6FF', rgb: '125,185,255', ink: '#04101F', s: ['#3E78C9', '#CFE6FF', '#7DB9FF', '#F3F9FF', '#4F8BD9'] },
      platinum: { c: '#DDE3EE', l: '#FFFFFF', rgb: '220,228,240', ink: '#0A0C10', s: ['#8E97A8', '#F6F8FC', '#C3CAD6', '#FFFFFF', '#9AA3B3'] },
      violet: { c: '#A78BFF', l: '#DCD2FF', rgb: '167,139,255', ink: '#120A2A', s: ['#6C4FE0', '#DCD2FF', '#A78BFF', '#F3EEFF', '#7A5CF0'] },
      gold: { c: '#F0C462', l: '#FFE3A0', rgb: '240,196,98', ink: '#1A1206', s: ['#A9792A', '#F7DC94', '#E0B04E', '#FFF3C8', '#B8893A'] }
    };
    const T0 = TH[this.props.theme] || TH.violet;
    const t = { ...T0, s1: T0.s[0], s2: T0.s[1], s3: T0.s[2], s4: T0.s[3], g: 'linear-gradient(110deg, ' + T0.s[0] + ' 0%, ' + T0.s[1] + ' 28%, ' + T0.s[2] + ' 52%, ' + T0.s[3] + ' 72%, ' + T0.s[4] + ' 100%)' };
    const ICONS = {
      search: 'M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14z M20 20l-4-4',
      compass: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M15.5 8.5l-2 5-5 2 2-5z',
      palette: 'M12 3a9 9 0 0 0 0 18c1.2 0 1.6-.8 1.6-1.6 0-1.3-1-1.4-1-2.6 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z M7.5 11h.01 M10 7h.01 M14.5 7h.01',
      pen: 'M4 20l4-1 11-11-3-3L5 16z M14 6l3 3',
      shapes: 'M7 3l4 7H3z M17 14a4 4 0 1 0 0 8a4 4 0 1 0 0-8z M14 3h7v7h-7z',
      layers: 'M12 3l9 5-9 5-9-5z M3 13l9 5 9-5',
      grid: 'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z',
      code: 'M8 7l-5 5 5 5 M16 7l5 5-5 5 M14 4l-4 16',
      rocket: 'M12 15l-3-3c1-4 4-8 9-9-1 5-5 8-9 9 M9 12l-4 1 2-4 4-1 M12 15l-1 4 4-2 1-4 M6 18c-1 0-2 1-2 2 1 0 2-1 2-2z',
      gauge: 'M4 18a8 8 0 1 1 16 0 M12 18l4-6',
      form: 'M5 3h14v18H5z M8 8h8 M8 12h8 M8 16h4',
      chat: 'M4 5h16v11H9l-5 4z',
      phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2',
      missed: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2 M16 3l5 5 M21 3l-5 5',
      calendar: 'M4 6h16v14H4z M4 10h16 M8 3v5 M16 3v5 M9 15l2 2 4-4',
      bell: 'M6 16V11a6 6 0 0 1 12 0v5l2 2H4z M10 21h4',
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
      gear: 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1',
      chart: 'M4 20V10 M10 20V4 M16 20v-7 M21 20H3',
      camera: 'M4 7h4l2-3h4l2 3h4v12H4z M12 10a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7z',
      mic: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5 11a7 7 0 0 0 14 0 M12 18v3',
      film: 'M4 4h16v16H4z M8 4v16 M16 4v16 M4 9h4 M4 15h4 M16 9h4 M16 15h4',
      send: 'M21 3L3 10.5l7.5 3L13 21z M10.5 13.5L21 3',
      bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
      target: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z M12 11.5a.5.5 0 1 0 0 1a.5.5 0 1 0 0-1z',
      users: 'M9 11a4 4 0 1 0 0-8a4 4 0 1 0 0 8z M2 21a7 7 0 0 1 14 0 M17 4a4 4 0 0 1 0 7 M19 21a6 6 0 0 0-3-5',
      inbox: 'M3 13l3-8h12l3 8v6H3z M3 13h5l1 3h6l1-3h5',
      dollar: 'M12 2v20 M17 6H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6',
      globe: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18',
      image: 'M4 5h16v14H4z M4 16l5-5 4 4 3-3 4 4 M15 8.5a1 1 0 1 0 0 .01',
      wand: 'M4 20L16 8 M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1z M19 11l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5z',
      lock: 'M6 11h12v10H6z M8 11V8a4 4 0 0 1 8 0v3',
      loop: 'M4 12a8 8 0 0 1 14-5l2 2 M20 4v5h-5 M20 12a8 8 0 0 1-14 5l-2-2 M4 20v-5h5',
      crm: 'M3 5h18v4H3z M3 11h18v4H3z M3 17h18v4H3z M7 7h.01 M7 13h.01 M7 19h.01',
      check: 'M5 12l5 5 9-10',
      eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z'
    };
    const raw = this.props.steps || [];
    const n = raw.length || 1;
    const i = Math.min(this.state.i, n - 1);
    const steps = raw.map((s, k) => ({
      t: s.t, d: s.d, when: s.when || '', hasWhen: !!s.when, auto: !!s.auto,
      icon: ICONS[s.icon] || ICONS.check, num: String(k + 1).padStart(2, '0'),
      cur: k === i, done: k < i, aria: 'Step ' + (k + 1) + ': ' + s.t,
      go: () => this.setState({ i: k })
    }));
    const playing = !this.state.paused;
    return {
      t, steps, total: String(n).padStart(2, '0'), label: this.props.label || 'How it works', dur: '4.2s',
      playing, stopped: !playing, playLabel: playing ? 'Pause' : 'Play',
      rootCls: playing ? '' : 'paused',
      toggle: () => this.setState({ paused: !this.state.paused }),
      next: () => this.setState({ i: (i + 1) % n }),
      prev: () => this.setState({ i: (i - 1 + n) % n })
    };
  }
}
</script>
</body>
</html>
