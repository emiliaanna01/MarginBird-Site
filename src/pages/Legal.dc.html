<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Privacy, Terms and SMS Terms | MarginBird</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f901add9d736276c532f1e80529fbc09">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#06050B}</style>
</helmet>
<div style="--acc: #A78BFF; --accl: #DCD2FF; --rgb: 167,139,255; font-family: Geist, system-ui, sans-serif; color: #F4EFE6; background: #06050B; width: 100%; box-sizing: border-box">
<dc-import name="Nav" theme="violet" current="legal" hint-size="100%,72px"></dc-import>
<main style="max-width: 820px; margin: 0 auto; padding: 150px 24px 100px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #A78BFF">Legal</p>
<h1 style="font-weight: 500; font-size: clamp(40px, 6vw, 64px); line-height: 1; letter-spacing: -0.045em; margin: 16px 0 0">Plain English, no small print.</h1>
<p style="margin: 18px 0 0; font-size: 15px; color: #A7B0C0">Effective [Effective date] · Questions: [Business email]</p>
<div role="tablist" aria-label="Legal documents" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 36px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-family: Geist, sans-serif; font-size: 15px; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
<article role="tabpanel" style="margin-top: 40px">
<h2 style="font-weight: 500; font-size: 36px; letter-spacing: -0.03em; margin: 0">{{doc.title}}</h2>
<p style="margin: 14px 0 0; font-size: 17px; line-height: 1.7; color: #DCE1EA">{{doc.intro}}</p>
<sc-for list="{{doc.sections}}" as="sec" hint-placeholder-count="8">
<section style="margin-top: 36px; padding-top: 28px; border-top: 1px solid rgba(244,239,230,0.08)">
<h3 style="font-weight: 500; font-size: 21px; letter-spacing: -0.01em; margin: 0">{{sec.h}}</h3>
<sc-for list="{{sec.p}}" as="para" hint-placeholder-count="2"><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: #C9D0DC">{{para}}</p></sc-for>
</section>
</sc-for>
</article>
<p style="margin: 56px 0 0; font-size: 13px; line-height: 1.6; color: #77809A">Template drafted for review. Have a lawyer check it before launch.</p>
</main>
<dc-import name="Footer" theme="violet" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4200}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'privacy' }; }
  renderVals() {
    const D = {"privacy": {"title": "Privacy Policy", "intro": "This policy explains what information MarginBird LLC collects through this website, why we collect it, and the choices you have. It applies from [Effective date]. We keep it short and plain on purpose.", "sections": [{"h": "What we collect", "p": ["When you request a free audit, we collect your name, email address, business website, and, if you choose one, what takes up most of your time.", "If you accept analytics or marketing cookies, we also collect basic usage data such as pages viewed, approximate location, device and browser type, and how you arrived at our site.", "We do not ask for payment details, health information, or other sensitive information through this website."]}, {"h": "How we use it", "p": ["We use your details to prepare your audit, reply to you, and follow up about our services. We may send you occasional emails related to your request; you can ask us to stop at any time.", "We use analytics data to understand which pages are useful and to improve the site and our advertising. We do not sell your personal information."]}, {"h": "Cookies and analytics", "p": ["We plan to use Google Analytics 4 and the Meta Pixel. These only load after you give consent through the cookie banner.", "You can accept, decline, or change your choice at any time through the cookie settings link on our site. Essential cookies needed for the site to work do not require consent.", "Where your browser sends a Global Privacy Control signal, we treat it as a request to opt out of marketing cookies."]}, {"h": "Who we share it with", "p": ["We share information only with service providers that help us run our business, such as Google (Google Workspace and Google Sheets for storing leads and sending alerts, Google Analytics), Meta (if you consent to marketing cookies), and our website hosting provider.", "These providers process data on our behalf under their own terms and security practices. We may also disclose information if the law requires it or to protect our rights.", "Our team works from outside the United States, so your information may be accessed and processed in other countries. We take reasonable steps to keep it protected wherever it is handled."]}, {"h": "How long we keep it", "p": ["We keep audit request details for as long as they are useful for our conversation with you, and generally no longer than 24 months after our last contact, unless you become a client.", "Client records are kept for the length of the engagement and as long as needed afterwards for legal, tax, and accounting purposes. You can ask us to delete your information sooner."]}, {"h": "Your rights and choices", "p": ["You can ask us to tell you what information we hold about you, correct it, delete it, or stop sending you marketing emails. Email us at [Business email] and we will respond within a reasonable time.", "Residents of California and other US states with privacy laws may have additional rights, such as the right to know, delete, correct, and opt out of the sale or sharing of personal information for targeted advertising. We do not sell personal information, and you can opt out of sharing for advertising by declining marketing cookies.", "We will not treat you differently for using any of these rights. We may need to confirm your identity before acting on a request."]}, {"h": "Children", "p": ["This website is for businesses and is not directed at children under 16. We do not knowingly collect information from children. If you believe a child has sent us information, contact us and we will delete it."]}, {"h": "Changes and contact", "p": ["We may update this policy as our services or the law change. We will post the new version here with an updated effective date.", "Questions or requests: [Business email] or MarginBird LLC, [Mailing address]."]}]}, "terms": {"title": "Terms of Service", "intro": "These terms apply to your use of the MarginBird website, operated by MarginBird LLC, and set the basics for how we work with clients. By using this site you agree to them. Effective [Effective date].", "sections": [{"h": "Using this website", "p": ["You may browse this site and use its content for your own information. Please do not copy our content for commercial use, misuse the forms, or try to disrupt the site.", "We work to keep the site accurate and available, but it is provided as is and may change or be unavailable from time to time."]}, {"h": "The free audit", "p": ["The free audit is offered with no obligation to buy anything. It is our professional opinion based on the information available to us at the time.", "Suggestions and estimates in an audit are not a promise of specific results, such as leads, sales, rankings, or ad performance."]}, {"h": "Client work is governed by a written scope", "p": ["Every paid engagement has a written scope or proposal that sets out the services, deliverables, timeline, price, and term. If that scope and these terms disagree, the scope wins.", "Some packages are month-to-month and some have a 3-month minimum, then continue monthly. Your scope states which applies and how to cancel."]}, {"h": "Ownership of accounts and work", "p": ["You own your business accounts, including domains, ad accounts, social pages, and CRM data. Where possible they are set up in your name, and we access them as a user you can remove.", "Once paid in full, you own the final deliverables we create for you, such as your website, logos, and ad creative. We keep ownership of our general tools, templates, and know-how, and may show completed work in our portfolio unless you ask us not to.", "Third-party software, fonts, stock images, and platforms remain subject to their own licenses and terms."]}, {"h": "Payments and ad spend", "p": ["Our fees, billing dates, and payment terms are set out in your scope. We may pause work if invoices are overdue.", "Advertising spend is billed directly to you by Meta, Google, or the relevant platform. We never mark up your ad spend, and we are not responsible for platform charges, policy decisions, or account restrictions."]}, {"h": "Guarantees", "p": ["Any guarantee applies only as written in your scope. For example, our website guarantee is: site live in 14 days or your first month of care is free, provided you supply the content, access, and approvals we need on time.", "Beyond what your scope states, we do not guarantee specific business results, because those depend on many factors outside our control."]}, {"h": "Your responsibilities", "p": ["You are responsible for the accuracy of the information and materials you give us, and for making sure your business, offers, and messages follow the laws and platform rules that apply to you.", "This includes having proper consent before contacting customers by text, phone, or email through systems we set up."]}, {"h": "Limitation of liability", "p": ["To the fullest extent the law allows, we are not liable for indirect or consequential losses, such as lost profits, lost data, or lost business, or for failures of third-party platforms.", "Our total liability for any claim related to our services is limited to the fees you paid us in the 3 months before the claim arose."]}, {"h": "Changes, governing law, and contact", "p": ["We may update these terms and will post the new version here with an updated effective date. Changes do not affect a signed scope already in place.", "These terms are governed by the laws of [Governing law jurisdiction].", "Questions: [Business email] or MarginBird LLC, [Mailing address]."]}]}, "sms": {"title": "SMS Terms", "intro": "These terms cover text messages sent by MarginBird LLC and by texting systems MarginBird builds and manages for its client businesses. Effective [Effective date].", "sections": [{"h": "Who sends these messages", "p": ["Most messages covered here are sent on behalf of a local business you contacted, such as a reply after a missed call, a follow-up on an inquiry, an appointment reminder, or a review request. That business is the sender, and MarginBird operates the system for them.", "MarginBird may also text you directly if you have asked us to, for example about your audit or project."]}, {"h": "Consent", "p": ["You will only receive messages if you have given consent, for example by submitting a form with an SMS consent checkbox, texting a business first, or agreeing when you called.", "Consent to receive marketing texts is never a condition of buying any product or service. Client businesses register their messaging with US carriers (A2P 10DLC) and are responsible for collecting proper consent."]}, {"h": "Message frequency and cost", "p": ["Message frequency varies depending on your conversation with the business.", "Message and data rates may apply, according to your mobile plan."]}, {"h": "How to opt out", "p": ["Reply STOP to any message to stop receiving texts from that number. You will receive one confirmation message, and no further texts will be sent unless you opt in again.", "You can also reply with words like UNSUBSCRIBE, CANCEL, or QUIT, or ask the business directly."]}, {"h": "Getting help", "p": ["Reply HELP to any message for help and contact details.", "You can also reach MarginBird at [Business email]."]}, {"h": "Your mobile number", "p": ["Mobile numbers and SMS consent are not shared with or sold to third parties or affiliates for their marketing purposes.", "We share numbers only with the service providers needed to deliver messages, such as our texting platform and the mobile carriers."]}, {"h": "Health information", "p": ["For health and wellness businesses, such as med spas, our forms and texts are designed not to collect health or medical information.", "Please do not send medical details by text. Share them directly with the provider through their secure channels."]}, {"h": "Carriers and delivery", "p": ["Mobile carriers are not liable for delayed or undelivered messages.", "Messages may not be delivered if you are out of coverage, your phone is off, or your carrier does not support them."]}, {"h": "Privacy and contact", "p": ["Information collected through texting is handled as described in our Privacy Policy and, for client businesses, their own privacy policy.", "Questions: [Business email] or MarginBird LLC, [Mailing address]."]}]}};
    const tabs = [['privacy', 'Privacy'], ['terms', 'Terms'], ['sms', 'SMS Terms']].map(([id, label]) => {
      const on = this.state.tab === id;
      return { label, sel: on ? 'true' : 'false', bg: on ? '#F4EFE6' : 'transparent', fg: on ? '#06050B' : '#DCE1EA', border: on ? '#F4EFE6' : 'rgba(244,239,230,0.2)', pick: () => this.setState({ tab: id }) };
    });
    return { tabs, doc: D[this.state.tab] };
  }
}
</script>
</body>
</html>
