<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time saved bars</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f901add9d736276c532f1e80529fbc09">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Fraunces:opsz,wght@9..144,300;9..144,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="--acc: {{t.c}}; --rgb: {{t.rgb}}; font-family: Geist, system-ui, sans-serif; color: #F4EFE6; border-radius: 28px; background: linear-gradient(180deg, #121B2C 0%, #080B13 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 0 0 1px rgba(244,239,230,0.07); padding: 40px; display: flex; flex-wrap: wrap; gap: 40px 56px; align-items: center">
<div style="flex: 0 1 300px">
<div style="font-size: 15px; color: #BAC2D0">Time back every week</div>
<div style="font-family: Fraunces, serif; font-weight: 300; font-size: 96px; line-height: 1; letter-spacing: -0.045em; margin-top: 10px; background: {{t.g}}; -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba({{t.rgb}},0.45))">{{headline}}</div>
<div style="font-size: 17px; color: #DCE1EA; margin-top: 8px">hours a week</div>
<div style="display: flex; gap: 18px; margin-top: 26px; font-size: 14px; color: #A7B0C0">
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 18px; height: 6px; border-radius: 3px; background: rgba(244,239,230,0.22)"></span>Doing it by hand</span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 18px; height: 6px; border-radius: 3px; background: {{t.g}}; box-shadow: 0 0 8px {{t.c}}"></span>With the system</span>
</div>
</div>
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div>
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 16px; margin-bottom: 9px"><span style="font-weight: 500">{{r.label}}</span><span style="color: {{t.l}}; font-variant-numeric: tabular-nums">{{r.saved}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 10px; border-radius: 5px; background: rgba(244,239,230,0.05); overflow: hidden"><div class="grow" style="height: 100%; width: {{r.bw}}; border-radius: 5px; background: rgba(244,239,230,0.22); animation-delay: {{r.d1}}"></div></div>
<div style="height: 10px; border-radius: 5px; background: rgba(244,239,230,0.05); overflow: hidden"><div class="grow" style="height: 100%; width: {{r.aw}}; min-width: 10px; border-radius: 5px; background: {{t.g}}; box-shadow: 0 0 12px {{t.c}}; animation-delay: {{r.d2}}"></div></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #8F99AD; margin-top: 6px; font-variant-numeric: tabular-nums"><span>{{r.beforeTxt}} by hand</span><span>{{r.afterTxt}} with us</span></div>
</div>
</sc-for>
<p style="font-size: 13px; line-height: 1.5; color: #8F99AD; margin: 4px 0 0">{{note}}</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"violet","options":["ice","platinum","violet","gold"]},"rows":{"editor":null},"headline":{"editor":"text","default":"8"},"note":{"editor":"text","default":"Hours are MarginBird estimates for a typical small business."},"$preview":{"width":1100,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = {
      ice: { c: '#7DB9FF', l: '#CFE6FF', rgb: '125,185,255', s: ['#3E78C9', '#CFE6FF', '#7DB9FF', '#F3F9FF', '#4F8BD9'] },
      platinum: { c: '#DDE3EE', l: '#FFFFFF', rgb: '220,228,240', s: ['#8E97A8', '#F6F8FC', '#C3CAD6', '#FFFFFF', '#9AA3B3'] },
      violet: { c: '#A78BFF', l: '#DCD2FF', rgb: '167,139,255', s: ['#6C4FE0', '#DCD2FF', '#A78BFF', '#F3EEFF', '#7A5CF0'] },
      gold: { c: '#F0C462', l: '#FFE3A0', rgb: '240,196,98', s: ['#A9792A', '#F7DC94', '#E0B04E', '#FFF3C8', '#B8893A'] }
    };
    const T0 = TH[this.props.theme] || TH.violet;
    const t = { ...T0, g: 'linear-gradient(110deg, ' + T0.s[0] + ' 0%, ' + T0.s[1] + ' 28%, ' + T0.s[2] + ' 52%, ' + T0.s[3] + ' 72%, ' + T0.s[4] + ' 100%)' };
    const raw = this.props.rows || [];
    const max = Math.max(1, ...raw.map((r) => r.before));
    const fmt = (h) => (h < 1 ? Math.round(h * 60) + ' min' : (Math.round(h * 10) / 10) + ' h');
    const rows = raw.map((r, k) => ({
      label: r.label, bw: Math.round(r.before / max * 100) + '%', aw: Math.max(2, Math.round(r.after / max * 100)) + '%',
      beforeTxt: fmt(r.before) + '/wk', afterTxt: fmt(r.after) + '/wk', saved: '−' + fmt(r.before - r.after),
      d1: (0.1 + k * 0.15).toFixed(2) + 's', d2: (0.5 + k * 0.15).toFixed(2) + 's'
    }));
    return { t, rows, headline: this.props.headline || '8', note: this.props.note || '' };
  }
}
</script>
</body>
</html>
